<!doctype html>
<html lang="en">

  <title>Pocket Paint Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
  <style>
    :root{--bg:#11141b;--panel:#1c212c;--panel2:#252b38;--line:#343b49;--text:#f4f5f8;--muted:#a7afbf;--accent:#a7f36b}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif}button,input,select{font-family:"DM Sans",sans-serif}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .app{max-width:760px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:24px}
    header{display:flex;align-items:center;justify-content:space-between;padding:17px 18px 12px;gap:12px}.brand{display:flex;align-items:center;gap:10px}.logo{width:35px;height:35px;border-radius:11px;background:var(--accent);color:#172016;display:grid;place-items:center;transform:rotate(-8deg)}.logo svg{width:20px}.brand strong{font-family:"Space Grotesk",sans-serif;font-size:17px;letter-spacing:-.5px}.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:1.6px;text-transform:uppercase}.header-actions{display:flex;gap:7px}.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);width:36px;height:36px;border-radius:11px;display:grid;place-items:center}.iconbtn svg{width:17px;height:17px}.iconbtn:disabled{opacity:.35;cursor:not-allowed}
    .workspace{padding:0 12px}.canvas-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;padding:4px 5px 9px}.canvas-top b{color:var(--text);font-weight:600}.canvas-shell{height:min(55vh,500px);min-height:290px;overflow:auto;background-color:#dedfe3;background-image:linear-gradient(45deg,#cdd0d5 25%,transparent 25%),linear-gradient(-45deg,#cdd0d5 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cdd0d5 75%),linear-gradient(-45deg,transparent 75%,#cdd0d5 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;display:flex;align-items:center;justify-content:center;border-radius:17px;touch-action:none;position:relative}.canvas-shell.zoomed{justify-content:flex-start;align-items:flex-start;touch-action:pan-x pan-y}.canvas-stage{position:relative;flex:none;box-shadow:0 8px 30px #14182035;line-height:0}.canvas-stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}.canvas-stage #paintCanvas{position:relative;background:white}.canvas-stage #overlayCanvas{pointer-events:none}.canvas-stage #interactionCanvas{background:transparent}
    .zoom-row{display:flex;align-items:center;justify-content:center;gap:14px;padding:11px}.zoom-row button{border:0;background:var(--panel2);color:var(--text);width:29px;height:29px;border-radius:9px;font-size:19px;line-height:1}.zoom-row span{color:var(--muted);font-size:12px;min-width:42px;text-align:center}
    .tool-area{border-top:1px solid var(--line);padding:14px 12px 0}.section-head{display:flex;justify-content:space-between;align-items:center;margin:0 4px 10px}.section-head h2{font-family:"Space Grotesk",sans-serif;font-size:13px;letter-spacing:.2px;margin:0}.section-head span{font-size:11px;color:var(--muted)}.tools{display:flex;gap:7px;overflow-x:auto;padding:0 2px 11px;scrollbar-width:none}.tools::-webkit-scrollbar{display:none}.tool{flex:none;min-width:62px;display:flex;flex-direction:column;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:12px;padding:10px 8px 8px;font-size:10px;transition:background .18s ease,border-color .18s ease,color .18s ease,transform .18s ease,box-shadow .18s ease}.tool svg{width:19px;height:19px;transition:transform .18s ease}.tool:hover{background:#303746;color:var(--text);transform:translateY(-2px)}.tool:hover svg{transform:scale(1.08)}.tool:active{transform:translateY(0) scale(.97)}.tool.active{background:#293a29;border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px #a7f36b22,0 5px 18px #0002}.tool.active:hover{background:#304630}.controls{margin-top:5px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.control-title{font-size:12px;font-weight:700;margin-bottom:13px}.control-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}.field label{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:7px}.field label output{color:var(--text)}input[type=range]{width:100%;accent-color:var(--accent);margin:0;height:22px}.color-line{display:flex;gap:10px;align-items:center;margin-bottom:14px}.color-picker{width:45px;height:40px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);cursor:pointer}.hex{font-size:12px;color:var(--text);font-weight:700;min-width:65px}.hue-wrap{flex:1}.hue-wrap label{font-size:10px;color:var(--muted);display:block;margin-bottom:3px}.swatches{display:flex;align-items:center;gap:7px;overflow-x:auto;padding-top:13px;margin-top:12px;border-top:1px solid var(--line)}.swatch{width:25px;height:25px;flex:none;border-radius:8px;border:2px solid #ffffff40}.swatch.selected{outline:2px solid var(--accent);outline-offset:2px}.add-swatch{flex:none;border:1px dashed #667080;background:transparent;color:var(--text);border-radius:8px;width:25px;height:25px;font-size:17px}.control-extra{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.chip{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:8px 11px;font-size:11px}.chip.active{border-color:var(--accent);color:var(--accent)}select,.text-input{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 10px;font-size:12px;min-width:0}.text-input{width:100%}.text-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.selection-actions{display:flex;gap:7px;flex-wrap:wrap}.hint{font-size:11px;color:var(--muted);line-height:1.5;margin:10px 0 0}.status{min-height:18px;color:var(--accent);font-size:11px;padding:8px 3px 0}.file-input{display:none}
  </style>
 </head>
 <body>
  <div class="app">
   <header class="canva-header">
    <div class="brand">
     <div class="logo"><i data-lucide="palette"></i>
     </div>
     <div><strong>Pocket Paint</strong><small>Creative studio</small>
     </div>
    </div>
    <div class="header-actions">
     <button id="importBtn" class="iconbtn canva-button" aria-label="Add image from gallery" title="Add image"><i data-lucide="image-plus"></i></button> <button id="undoBtn" class="iconbtn canva-button" aria-label="Undo" title="Undo"><i data-lucide="undo-2"></i></button> <button id="redoBtn" class="iconbtn canva-button" aria-label="Redo" title="Redo"><i data-lucide="redo-2"></i></button>
    </div>
   </header>
   <main>
    <section class="workspace canva-section" aria-label="Drawing workspace">
     <div class="canvas-top"><b>Untitled canvas</b><span>800 × 600 px</span>
     </div>
     <div id="canvasShell" class="canvas-shell">
      <div id="canvasStage" class="canvas-stage">
       <canvas id="paintCanvas" width="800" height="600" aria-label="Painting canvas"></canvas>
       <canvas id="overlayCanvas" width="800" height="600" aria-hidden="true"></canvas>
       <canvas id="interactionCanvas" width="800" height="600" aria-label="Draw here using the selected tool"></canvas>
      </div>
     </div>
     <div class="zoom-row"><button id="zoomOut" class="canva-button" aria-label="Zoom out">−</button><span id="zoomLabel">Fit</span><button id="zoomIn" class="canva-button" aria-label="Zoom in">+</button><button id="zoomFit" class="chip canva-button">Fit</button>
     </div>
    </section>
    <section class="tool-area canva-section" aria-label="Painting tools">
     <div class="section-head">
      <h2>Tools</h2><span>Swipe to explore →</span>
     </div>
     <div id="tools" class="tools canva-list">
      <button class="tool active canva-button" data-tool="pencil"><i data-lucide="pencil"></i>Pencil</button> <button class="tool canva-button" data-tool="pen"><i data-lucide="pen"></i>Pen</button> <button class="tool canva-button" data-tool="fountain"><i data-lucide="pen-tool"></i>Fountain pen</button> <button class="tool canva-button" data-tool="marker"><i data-lucide="highlighter"></i>Marker</button> <button class="tool canva-button" data-tool="brush"><i data-lucide="paintbrush"></i>Brush</button> <button class="tool canva-button" data-tool="eraser"><i data-lucide="eraser"></i>Eraser</button> <button class="tool canva-button" data-tool="bucket"><i data-lucide="paint-bucket"></i>Fill</button> <button class="tool canva-button" data-tool="picker"><i data-lucide="pipette"></i>Pick</button> <button class="tool canva-button" data-tool="line"><i data-lucide="slash"></i>Line</button> <button class="tool canva-button" data-tool="rect"><i data-lucide="square"></i>Rectangle</button> <button class="tool canva-button" data-tool="ellipse"><i data-lucide="circle"></i>Circle</button> <button class="tool canva-button" data-tool="text"><i data-lucide="type"></i>Text</button> <button class="tool canva-button" data-tool="selectRect"><i data-lucide="scan"></i>Rect select</button> <button class="tool canva-button" data-tool="selectFree"><i data-lucide="lasso"></i>Free select</button>
     </div>
     <div class="controls canva-panel">
      <div id="controlTitle" class="control-title">
       Pencil settings
      </div>
      <div class="color-line">
       <input id="colorPicker" class="color-picker canva-input" type="color" value="#7259f5" aria-label="Color wheel"> <span id="hexLabel" class="hex">#7259F5</span>
       <div class="hue-wrap"><label for="hueSlider">Hue</label><input id="hueSlider" class="canva-input" type="range" min="0" max="360" value="250">
       </div>
      </div>
      <div class="control-grid">
       <div class="field"><label for="sizeSlider">Thickness <output id="sizeValue">8 px</output></label><input id="sizeSlider" class="canva-input" type="range" min="1" max="80" value="8">
       </div>
       <div class="field"><label for="opacitySlider">Opacity <output id="opacityValue">100%</output></label><input id="opacitySlider" class="canva-input" type="range" min="1" max="100" value="100">
       </div>
      </div>
      <div id="extraControls" class="control-extra"></div>
      <div class="swatches" id="swatches"><button id="addSwatch" class="add-swatch canva-button" title="Save current color" aria-label="Save current color">+</button>
      </div>
      <p id="toolHint" class="hint">Draw directly on the canvas.</p>
     </div>
     <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>
   </main>
  </div><input id="imageInput" class="file-input canva-input" type="file" accept="image/*" aria-label="Choose an image">
  <script>
(()=>{
const W=800,H=600,canvas=document.getElementById('paintCanvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),overlay=document.getElementById('overlayCanvas'),oc=overlay.getContext('2d'),hit=document.getElementById('interactionCanvas'),stage=document.getElementById('canvasStage'),shell=document.getElementById('canvasShell');
const $=id=>document.getElementById(id);let tool='pencil',color='#7259f5',size=8,opacity=1,zoom=0,shapeFilled=false,gradient=false,gradientColor='#ffffff',textFont='DM Sans',textValue='',history=[],historyIndex=-1,drawing=false,last=null,start=null,path=[],selection=null,dragOffset=null;
const palette=['#20232b','#ffffff','#ef555d','#ffae50','#f8df68','#72c889','#55bcd3','#7259f5'];
const markerLayer=document.createElement('canvas');markerLayer.width=W;markerLayer.height=H;const markerCtx=markerLayer.getContext('2d');let strokeMoved=false,strokePressure=1;
function pressureOf(e){return e.pointerType==='pen'&&e.pressure>0?Math.max(.35,e.pressure):1}
function markerPreview(){clearOverlay();oc.save();oc.globalAlpha=opacity*.42;oc.drawImage(markerLayer,0,0);oc.restore()}
function refinedSample(p,pressure){if(tool==='marker'){markerCtx.save();markerCtx.fillStyle=color;markerCtx.beginPath();markerCtx.ellipse(p.x,p.y,Math.max(1,size*.85),Math.max(1,size*.58),-.35,0,Math.PI*2);markerCtx.fill();markerCtx.restore();return}let width=Math.max(.7,size*.38*(.72+.28*pressure));ctx.save();ctx.fillStyle=rgba(color,opacity*.48);ctx.beginPath();ctx.arc(p.x,p.y,width/2,0,Math.PI*2);ctx.fill();const seed=Math.sin(p.x*12.9898+p.y*78.233)*43758.5453,grain=seed-Math.floor(seed);if(grain>.34){ctx.globalAlpha=opacity*.22;ctx.beginPath();ctx.arc(p.x+(grain-.5)*width*.8,p.y+(grain-.5)*width*.65,Math.max(.3,width*.18),0,Math.PI*2);ctx.fill()}ctx.restore()}
function refinedLine(a,b,pa=1,pb=1){let distance=Math.hypot(b.x-a.x,b.y-a.y),steps=Math.max(1,Math.ceil(distance/Math.max(.55,tool==='marker'?size*.12:size*.11)));for(let i=0;i<=steps;i++){let t=i/steps;refinedSample({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t},pa+(pb-pa)*t)}}

ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);
function save(){history=history.slice(0,historyIndex+1);history.push(ctx.getImageData(0,0,W,H));if(history.length>30)history.shift();historyIndex=history.length-1;updateHistory()}
function updateHistory(){$('undoBtn').disabled=historyIndex<=0;$('redoBtn').disabled=historyIndex>=history.length-1}
save();
function message(s){$('status').textContent=s;setTimeout(()=>{if($('status').textContent===s)$('status').textContent=''},2800)}
function fit(){let z=Math.min((shell.clientWidth-16)/W,(shell.clientHeight-16)/H);setZoom(z,true)}
function setZoom(z,isFit=false){zoom=Math.max(.2,Math.min(3,z));stage.style.width=W*zoom+'px';stage.style.height=H*zoom+'px';shell.classList.toggle('zoomed',W*zoom>shell.clientWidth||H*zoom>shell.clientHeight);$('zoomLabel').textContent=isFit?'Fit':Math.round(zoom*100)+'%'}
requestAnimationFrame(fit);window.addEventListener('resize',()=>{if($('zoomLabel').textContent==='Fit')fit()});
$('zoomIn').onclick=()=>setZoom(zoom*1.5);$('zoomOut').onclick=()=>setZoom(zoom/1.5);$('zoomFit').onclick=fit;
function point(e){let r=hit.getBoundingClientRect();return{x:Math.max(0,Math.min(W-1,(e.clientX-r.left)*W/r.width)),y:Math.max(0,Math.min(H-1,(e.clientY-r.top)*H/r.height))}}
function rgba(hex,a){let n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`}
function strokeSetup(c){c.lineCap='round';c.lineJoin='round';c.lineWidth=size;c.globalAlpha=tool==='marker'?opacity*.4:opacity;c.strokeStyle=color;if(tool==='pencil'){c.lineWidth=Math.max(1,size*.45);c.globalAlpha=opacity*.85}else if(tool==='brush'){c.shadowBlur=size*.65;c.shadowColor=rgba(color,.6)}else if(tool==='pen'){c.lineWidth=Math.max(1,size*.7)}else if(tool==='eraser'){c.globalCompositeOperation='destination-out';c.lineWidth=size*1.6;c.globalAlpha=1}}
function nibStamp(x,y){ctx.save();ctx.globalAlpha=opacity;ctx.fillStyle=color;ctx.translate(x,y);ctx.rotate(-Math.PI/4);ctx.beginPath();ctx.ellipse(0,0,Math.max(1,size*.52),Math.max(.45,size*.095),0,0,Math.PI*2);ctx.fill();ctx.restore()}
function nibLine(a,b){let distance=Math.hypot(b.x-a.x,b.y-a.y),steps=Math.max(1,Math.ceil(distance/Math.max(.35,size*.12)));for(let i=0;i<=steps;i++){let t=i/steps;nibStamp(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t)}}

function smoothPoint(p,pressure=1){if(Math.hypot(p.x-last.x,p.y-last.y)<.12)return;strokeMoved=true;let midpoint={x:(last.x+p.x)/2,y:(last.y+p.y)/2};if(tool==='pencil'||tool==='marker'){refinedCurve(start,last,midpoint,strokePressure,pressure)}else if(tool==='fountain'){let previous=start;for(let i=1;i<=Math.max(1,Math.ceil(Math.hypot(midpoint.x-start.x,midpoint.y-start.y)/2));i++){let t=i/Math.max(1,Math.ceil(Math.hypot(midpoint.x-start.x,midpoint.y-start.y)/2)),q={x:(1-t)*(1-t)*start.x+2*(1-t)*t*last.x+t*t*midpoint.x,y:(1-t)*(1-t)*start.y+2*(1-t)*t*last.y+t*t*midpoint.y};nibLine(previous,q);previous=q}}else{ctx.save();strokeSetup(ctx);ctx.beginPath();ctx.moveTo(start.x,start.y);ctx.quadraticCurveTo(last.x,last.y,midpoint.x,midpoint.y);ctx.stroke();ctx.restore()}start=midpoint;last=p;strokePressure=pressure}

function drawShape(c,a,b){c.save();c.lineWidth=size;c.strokeStyle=color;c.fillStyle=color;c.globalAlpha=opacity;c.lineCap='round';c.beginPath();if(tool==='line'){c.moveTo(a.x,a.y);c.lineTo(b.x,b.y)}else if(tool==='rect'){c.rect(Math.min(a.x,b.x),Math.min(a.y,b.y),Math.abs(b.x-a.x),Math.abs(b.y-a.y))}else{c.ellipse((a.x+b.x)/2,(a.y+b.y)/2,Math.max(1,Math.abs(b.x-a.x)/2),Math.max(1,Math.abs(b.y-a.y)/2),0,0,Math.PI*2)}if(shapeFilled&&tool!=='line')c.fill();else c.stroke();c.restore()}
function clearOverlay(){oc.clearRect(0,0,W,H)}
function drawSelection(){clearOverlay();if(!selection)return;oc.save();oc.setLineDash([8,6]);oc.strokeStyle='#111';oc.lineWidth=3;oc.strokeRect(selection.x,selection.y,selection.w,selection.h);oc.strokeStyle='#fff';oc.lineDashOffset=7;oc.strokeRect(selection.x,selection.y,selection.w,selection.h);oc.restore();oc.drawImage(selection.canvas,selection.x,selection.y)}
function makeSelection(points,free){let xs=points.map(p=>p.x),ys=points.map(p=>p.y),x=Math.max(0,Math.floor(Math.min(...xs))),y=Math.max(0,Math.floor(Math.min(...ys))),w=Math.min(W-x,Math.ceil(Math.max(...xs))-x),h=Math.min(H-y,Math.ceil(Math.max(...ys))-y);if(w<3||h<3)return;let temp=document.createElement('canvas');temp.width=w;temp.height=h;let tc=temp.getContext('2d');tc.drawImage(canvas,x,y,w,h,0,0,w,h);if(free){tc.globalCompositeOperation='destination-in';tc.beginPath();points.forEach((p,i)=>i?tc.lineTo(p.x-x,p.y-y):tc.moveTo(p.x-x,p.y-y));tc.closePath();tc.fill();ctx.save();ctx.globalCompositeOperation='destination-out';ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fill();ctx.restore()}else ctx.clearRect(x,y,w,h);selection={x,y,w,h,canvas:temp};drawSelection();renderExtras();message('Drag the cutout to move it, or use the actions below.')}
function applySelection(){if(!selection)return;ctx.drawImage(selection.canvas,selection.x,selection.y);selection=null;clearOverlay();save();renderExtras()}
function cancelSelection(){if(!selection)return;ctx.putImageData(history[historyIndex],0,0);selection=null;clearOverlay();renderExtras()}
function flipSelection(axis){if(!selection)return;let t=document.createElement('canvas');t.width=selection.w;t.height=selection.h;let c=t.getContext('2d');c.translate(axis==='h'?t.width:0,axis==='v'?t.height:0);c.scale(axis==='h'?-1:1,axis==='v'?-1:1);c.drawImage(selection.canvas,0,0);selection.canvas=t;drawSelection()}
function bucketFill(p){let image=ctx.getImageData(0,0,W,H),d=image.data,x=Math.floor(p.x),y=Math.floor(p.y),idx=(y*W+x)*4,target=[d[idx],d[idx+1],d[idx+2],d[idx+3]],mark=new Uint8Array(W*H),stack=[y*W+x],rgb=[1,3,5].map(i=>parseInt(color.slice(i,i+2),16)),rgb2=[1,3,5].map(i=>parseInt(gradientColor.slice(i,i+2),16));let changed=0;
while(stack.length){let n=stack.pop();if(mark[n])continue;mark[n]=1;let k=n*4;if(Math.abs(d[k]-target[0])+Math.abs(d[k+1]-target[1])+Math.abs(d[k+2]-target[2])+Math.abs(d[k+3]-target[3])>32)continue;let yy=Math.floor(n/W),t=gradient?yy/(H-1):0;for(let c=0;c<3;c++)d[k+c]=Math.round(d[k+c]*(1-opacity)+(rgb[c]*(1-t)+rgb2[c]*t)*opacity);d[k+3]=Math.round(d[k+3]*(1-opacity)+255*opacity);changed++;if(n%W)stack.push(n-1);if(n%W<W-1)stack.push(n+1);if(n>=W)stack.push(n-W);if(n<W*(H-1))stack.push(n+W)}
if(changed){ctx.putImageData(image,0,0);save()}}
hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);let p=point(e);
if(selection){if(p.x>=selection.x&&p.x<=selection.x+selection.w&&p.y>=selection.y&&p.y<=selection.y+selection.h){dragOffset={x:p.x-selection.x,y:p.y-selection.y};drawing=true}return}
if(tool==='picker'){let d=ctx.getImageData(Math.floor(p.x),Math.floor(p.y),1,1).data;setColor('#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join(''));message('Color sampled');return}
if(tool==='bucket'){bucketFill(p);return}
if(tool==='text'){if(!textValue.trim()){message('Enter text in the settings below first.');return}ctx.save();ctx.globalAlpha=opacity;ctx.fillStyle=color;ctx.font=`${size*2+12}px "${textFont}"`;ctx.textBaseline='top';textValue.split('\n').forEach((line,i)=>ctx.fillText(line,p.x,p.y+i*(size*2+18)));ctx.restore();save();return}
drawing=true;start=p;last=p;path=[p];strokeMoved=false;strokePressure=pressureOf(e);if(tool==='marker')markerCtx.clearRect(0,0,W,H);if(['pencil','pen','fountain','marker','brush','eraser'].includes(tool))dot(p)});
hit.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();let p=point(e);if(selection&&dragOffset){selection.x=Math.round(p.x-dragOffset.x);selection.y=Math.round(p.y-dragOffset.y);drawSelection();return}
if(['pencil','pen','fountain','marker','brush','eraser'].includes(tool)){let samples=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const sample of samples)smoothPoint(point(sample),pressureOf(sample));if(tool==='marker')markerPreview()}else if(['line','rect','ellipse'].includes(tool)){clearOverlay();drawShape(oc,start,p)}else if(tool==='selectRect'){clearOverlay();oc.save();oc.strokeStyle='#7259f5';oc.lineWidth=2;oc.setLineDash([8,5]);oc.strokeRect(start.x,start.y,p.x-start.x,p.y-start.y);oc.restore()}else if(tool==='selectFree'){path.push(p);clearOverlay();oc.save();oc.strokeStyle='#7259f5';oc.lineWidth=2;oc.setLineDash([8,5]);oc.beginPath();path.forEach((v,i)=>i?oc.lineTo(v.x,v.y):oc.moveTo(v.x,v.y));oc.stroke();oc.restore()}});
function finish(e){if(!drawing)return;drawing=false;if(selection){dragOffset=null;return}let p=point(e);if(['pencil','pen','fountain','marker','brush','eraser'].includes(tool)){if(Math.hypot(p.x-last.x,p.y-last.y)>.12)smoothPoint(p,pressureOf(e));if(strokeMoved)segment(start,p);if(tool==='marker'){ctx.save();ctx.globalAlpha=opacity*.42;ctx.drawImage(markerLayer,0,0);ctx.restore();markerCtx.clearRect(0,0,W,H);clearOverlay()}save()}else if(['line','rect','ellipse'].includes(tool)){clearOverlay();drawShape(ctx,start,p);save()}else if(tool==='selectRect'){clearOverlay();makeSelection([start,p],false)}else if(tool==='selectFree'){path.push(p);clearOverlay();if(path.length>2)makeSelection(path,true)}}
hit.addEventListener('pointerup',finish);hit.addEventListener('pointercancel',finish);
$('undoBtn').onclick=()=>{if(selection)cancelSelection();if(historyIndex>0){historyIndex--;ctx.putImageData(history[historyIndex],0,0);updateHistory()}};
$('redoBtn').onclick=()=>{if(selection)cancelSelection();if(historyIndex<history.length-1){historyIndex++;ctx.putImageData(history[historyIndex],0,0);updateHistory()}};
$('importBtn').onclick=()=>$('imageInput').click();$('imageInput').onchange=e=>{let file=e.target.files[0];if(!file)return;let url=URL.createObjectURL(file),img=new Image();img.onload=()=>{if(selection)applySelection();let scale=Math.min(W/img.width,H/img.height,1);ctx.drawImage(img,(W-img.width*scale)/2,(H-img.height*scale)/2,img.width*scale,img.height*scale);save();URL.revokeObjectURL(url);message('Image added to canvas')};img.onerror=()=>message('Could not open this image.');img.src=url;e.target.value=''};
function setColor(v){color=v.toLowerCase();$('colorPicker').value=color;$('hexLabel').textContent=color.toUpperCase();let n=parseInt(color.slice(1),16),r=(n>>16)/255,g=((n>>8)&255)/255,b=(n&255)/255,max=Math.max(r,g,b),min=Math.min(r,g,b),h=0;if(max!==min){let d=max-min;h=max===r?((g-b)/d)%6:max===g?(b-r)/d+2:(r-g)/d+4;h=(h*60+360)%360}$('hueSlider').value=Math.round(h);renderSwatches()}
$('colorPicker').oninput=e=>setColor(e.target.value);$('hueSlider').oninput=e=>{let h=+e.target.value/60,c=1,x=1-Math.abs(h%2-1),parts=h<1?[c,x,0]:h<2?[x,c,0]:h<3?[0,c,x]:h<4?[0,x,c]:h<5?[x,0,c]:[c,0,x];setColor('#'+parts.map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join(''))};
$('sizeSlider').oninput=e=>{size=+e.target.value;$('sizeValue').textContent=size+' px'};$('opacitySlider').oninput=e=>{opacity=+e.target.value/100;$('opacityValue').textContent=e.target.value+'%'};
function renderSwatches(){document.querySelectorAll('.swatch').forEach(b=>b.classList.toggle('selected',b.dataset.color===color))}
function addSwatch(c){let b=document.createElement('button');b.className='swatch canva-button';b.style.background=c;b.dataset.color=c;b.title=c;b.setAttribute('aria-label','Use color '+c);b.onclick=()=>setColor(c);$('swatches').insertBefore(b,$('addSwatch'))}
palette.forEach(addSwatch);$('addSwatch').onclick=()=>{if(document.querySelectorAll('.swatch').length>=20){message('Palette is full');return}addSwatch(color);renderSwatches();message('Color saved to palette')};renderSwatches();
$('tools').onclick=e=>{let b=e.target.closest('[data-tool]');if(!b)return;if(selection)applySelection();tool=b.dataset.tool;document.querySelectorAll('.tool').forEach(el=>el.classList.toggle('active',el===b));$('controlTitle').textContent=b.textContent.trim()+' settings';renderExtras()};
function renderExtras(){let box=$('extraControls');box.innerHTML='';let hint='Draw directly on the canvas.';function button(label,fn,active=false){let b=document.createElement('button');b.className='chip canva-button'+(active?' active':'');b.textContent=label;b.onclick=fn;box.appendChild(b)}
if(selection){hint='Drag the selected cutout on the canvas.';button('Flip horizontal',()=>flipSelection('h'));button('Flip vertical',()=>flipSelection('v'));button('Apply cutout',applySelection,true);button('Cancel',cancelSelection)}
else if(['rect','ellipse'].includes(tool)){button('Outline',()=>{shapeFilled=false;renderExtras()},!shapeFilled);button('Filled',()=>{shapeFilled=true;renderExtras()},shapeFilled);hint='Drag to create a shape.'}
else if(tool==='bucket'){button('Solid fill',()=>{gradient=false;renderExtras()},!gradient);button('Gradient fill',()=>{gradient=true;renderExtras()},gradient);if(gradient){let label=document.createElement('label');label.textContent='To color ';label.style.cssText='font-size:11px;color:#a7afbf;display:flex;align-items:center;gap:7px';let input=document.createElement('input');input.type='color';input.className='color-picker canva-input';input.value=gradientColor;input.setAttribute('aria-label','Gradient end color');input.oninput=e=>gradientColor=e.target.value;label.appendChild(input);box.appendChild(label)}hint='Tap a connected area to fill it. Gradient runs top to bottom.'}
else if(tool==='text'){let input=document.createElement('input');input.id='textContent';input.className='text-input canva-input';input.placeholder='Type your text here';input.setAttribute('aria-label','Text to place');input.value=textValue;input.oninput=e=>textValue=e.target.value;box.appendChild(input);let select=document.createElement('select');select.className='canva-dropdown';select.setAttribute('aria-label','Text font');['DM Sans','Space Grotesk','Georgia','Courier New','Arial'].forEach(f=>{let o=document.createElement('option');o.value=f;o.textContent=f;select.appendChild(o)});select.value=textFont;select.onchange=e=>textFont=e.target.value;box.appendChild(select);hint='Set text and tap the canvas to place it. Thickness controls text size.'}
else if(tool==='picker')hint='Tap any canvas color to sample it.';
else if(tool==='selectRect'||tool==='selectFree')hint='Trace a cutout, then drag it to move or flip it.';
else if(tool==='line')hint='Drag between two points to draw a straight line.';
else if(tool==='eraser')hint='Drag to erase pixels to transparency.';
else if(tool==='marker')hint='A broad, translucent stroke for highlighting.';
else if(tool==='brush')hint='A soft-edged, expressive paint stroke.';
else if(tool==='pen')hint='A smooth, solid ink stroke.';
else if(tool==='fountain')hint='A signature-style angled nib: broad downstrokes and fine cross-strokes.';
$('toolHint').textContent=hint}
renderExtras();if(window.lucide)lucide.createIcons();
})();
